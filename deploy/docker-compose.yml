version: '3.8'

services:
  # MySQL Database Service
  vgs-db:
    image: mysql:8.0
    container_name: vgsfinance-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-VgsSecretRoot2026!}
      MYSQL_DATABASE: ${DB_NAME:-vgsfinance_db}
      MYSQL_USER: ${DB_USER:-vgs_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vgs_secure_pass_2026}
    ports:
      - '3306:3306'
    volumes:
      - vgs_db_data:/var/lib/mysql
    networks:
      - vgs-network

  # Node.js Express Backend Service
  vgs-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: vgsfinance-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_DIALECT: mysql
      DB_HOST: vgs-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vgsfinance_db}
      DB_USER: ${DB_USER:-vgs_user}
      DB_PASSWORD: ${DB_PASSWORD:-vgs_secure_pass_2026}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      JWT_SECRET: ${JWT_SECRET:-vgs-finance-jwt-secret-key-2026}
    depends_on:
      - vgs-db
    ports:
      - '5000:5000'
    networks:
      - vgs-network

  # Nginx Reverse Proxy & React Web Client
  vgs-nginx:
    image: nginx:alpine
    container_name: vgsfinance-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/vgsfinance/frontend/dist:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - vgs-backend
    networks:
      - vgs-network

volumes:
  vgs_db_data:

networks:
  vgs-network:
    driver: bridge

