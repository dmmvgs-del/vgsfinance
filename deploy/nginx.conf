# ==============================================================================
# Nginx Production Configuration for VGS Finance & Loans Management Platform
# Reverse Proxy: Routes /api to Node.js backend (Port 5000), serves React SPA (Port 80/443)
# ==============================================================================

# API Rate Limiting Zone: 30 requests per minute per IP for fraud prevention
limit_req_zone $binary_remote_addr zone=vgs_api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=vgs_enquiry_limit:10m rate=5r/m;

# 1. HTTP Server - Redirects all unencrypted traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vgsfinance.com www.vgsfinance.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Production SSL/TLS Termination
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vgsfinance.com www.vgsfinance.com;

    # SSL Certificates (Managed via Certbot Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vgsfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vgsfinance.com/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Enterprise Financial Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:5000 https://vgsfinance.com https://wa.me;" always;

    # Compression Configuration (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root Directory for React Single Page Application (Production Build)
    root /var/www/vgsfinance/frontend/dist;
    index index.html;

    # 3. Backend REST API Reverse Proxy
    location /api/ {
        limit_req zone=vgs_api_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Strict Rate Limit for Customer Enquiry Submissions (Preventing Spam)
    location /api/leads {
        limit_req zone=vgs_enquiry_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Frontend Static Files & SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (JS, CSS, Images, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

